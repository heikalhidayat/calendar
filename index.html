<!DOCTYPE html>
<html>
<head>
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Calendar</h1>
  <p id="demo"></p>
  <hr>
  <div id="month">
    <button id="prevMonth" onclick="prevMonth()">Prev</button>
    <h2 id="thisMonth"></h2>
    <button id="nextMonth" onclick="nextMonth()">Next</button>
  </div>
  <div id="day">
    <p>Sun</p>
    <p>Mon</p>
    <p>Tue</p>
    <p>Wed</p>
    <p>Thu</p>
    <p>Fri</p>
    <p>Sat</p>
  </div>
  <div id="date"></div>
  <p id="selected"></p>
</body>
</html>
