<!DOCTYPE html> <!--dokumen menggunakan standar HTML5-->
<html lang="en"> <!--dokumen menggunakan bahasa Inggris-->
<head> <!--dokumen berisi informasi tentang dokumen itu sendiri-->
    <meta charset="UTF-8"> <!--dokumen menggunakan karakter UTF-8-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--dokumen dioptimalkan untuk tampilan di perangkat mobile-->
    <title>Document</title> <!--dokumen memiliki judul "Document"-->
</head>
<body> <!--dokumen berisi konten yang akan ditampilkan di browser-->
    <h1>Hello, World!</h1> <!--dokumen memiliki heading level 1 dengan teks "Hello, World!"-->
    <p>This is a simple HTML document.</p> <!--dokumen memiliki paragraf dengan teks "This is a simple HTML document."-->
</body>
</html>
